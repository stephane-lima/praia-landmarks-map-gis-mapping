<head>

    <!-- Load the ArcGIS JavaScript API modules -->

<body>
    <header>
        <h1>Local Landmarks Map</h1>
        <p>Explore notable landmarks in Praia, Cabo Verde</p>
    </header>

    <!-- Controls for filtering landmarks by category and search text -->
    <section class="controls">
        <label for="categoryFilter">Category:</label>

        <select id="categoryFilter">
            <option value="All">All</option>
            <option value="Historical">Historical</option>
            <option value="Museum">Museum</option>
            <option value="Park">Park</option>
            <option value="Beach">Beach</option>
            <option value="Religious">Religious</option>
            <option value="Cultural">Cultural</option>
        </select>

        <input type="text" id="searchBox" placeholder="Search landmarks...">

        <button id="resetButton">Reset</button>
    </section>

    <main>
        <!-- Sidebar that shows the current list of landmarks and count -->
        <aside id="sidebar">
            <h2>Landmarks</h2>
            <p id="landmarkCount">0 Landmarks</p>

            <div id="landmarkList"></div>
        </aside>

        <!-- Container that holds the ArcGIS map web component -->
        <section id="mapContainer">
            <!-- Modern ArcGIS Map Component -->
            <arcgis-map 
                center="-23.5133, 14.9177" 
                zoom="13"
            >
                <!-- Modern Zoom Component -->
                <arcgis-zoom slot="top-left"></arcgis-zoom>

                <!-- Modern Search Component -->
                <arcgis-search id="arcgisSearch" slot="top-right"></arcgis-search>

            </arcgis-map>
            
        </section>

    </main>

    <!-- Main application script for map setup and UI interaction -->
    <script type="module" src="script.js"></script>
</body>
</html>
